<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="CausalForge ranking pipeline: ingest, propagate, fuse, rank">
  <title>CausalForge ranking pipeline</title>
  <defs>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141619"/>
      <stop offset="1" stop-color="#0a0b0d"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a2a12"/>
      <stop offset="0.5" stop-color="#ff8a3c"/>
      <stop offset="1" stop-color="#ffe0a3"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="260" fill="url(#slab)"/>

  <!-- heat bar drawn across the pipeline as material moves through the forge -->
  <rect x="60" y="20" width="840" height="6" rx="3" fill="#23262c"/>
  <rect x="60" y="20" width="0" height="6" rx="3" fill="url(#heat)">
    <animate attributeName="width" values="0;840;840" keyTimes="0;0.8;1" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- four forge stations -->
  <g font-family="Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">
    <g>
      <rect x="70" y="90" width="170" height="90" rx="10" fill="#1c1f24" stroke="#ff8a3c" stroke-width="2"/>
      <text x="155" y="125" fill="#ffd27a" font-size="18" font-weight="700">Ingest</text>
      <text x="155" y="150" fill="#8a9099" font-size="12">events + edges</text>
      <text x="155" y="168" fill="#5b6068" font-size="11">JSON / stream</text>
    </g>
    <g>
      <rect x="280" y="90" width="170" height="90" rx="10" fill="#1c1f24" stroke="#ff8a3c" stroke-width="2"/>
      <text x="365" y="125" fill="#ffd27a" font-size="18" font-weight="700">Propagate</text>
      <text x="365" y="150" fill="#8a9099" font-size="12">temporal blame</text>
      <text x="365" y="168" fill="#5b6068" font-size="11">half-life kernel</text>
    </g>
    <g>
      <rect x="490" y="90" width="170" height="90" rx="10" fill="#1c1f24" stroke="#ff8a3c" stroke-width="2"/>
      <text x="575" y="125" fill="#ffd27a" font-size="18" font-weight="700">Fuse</text>
      <text x="575" y="150" fill="#8a9099" font-size="12">error evidence</text>
      <text x="575" y="168" fill="#5b6068" font-size="11">+ blast radius</text>
    </g>
    <g>
      <rect x="700" y="90" width="170" height="90" rx="10" fill="#1c1f24" stroke="#ffd27a" stroke-width="2.5"/>
      <text x="785" y="125" fill="#ffe0a3" font-size="18" font-weight="700">Rank</text>
      <text x="785" y="150" fill="#8a9099" font-size="12">suspects + report</text>
      <text x="785" y="168" fill="#5b6068" font-size="11">md / json</text>
    </g>
  </g>

  <!-- animated hammer strike between stations -->
  <g stroke="#ff8a3c" stroke-width="3" fill="none" filter="url(#soft)">
    <line x1="240" y1="135" x2="280" y2="135" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" from="16" to="0" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="450" y1="135" x2="490" y2="135" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" from="16" to="0" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="660" y1="135" x2="700" y2="135" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" from="16" to="0" dur="0.9s" begin="0.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- anvil ember sparks under the final rank -->
  <g fill="#ffb066">
    <circle cx="785" cy="185" r="2">
      <animate attributeName="cy" values="185;205" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="795" cy="185" r="1.6">
      <animate attributeName="cy" values="185;210" dur="1.5s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.5s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="777" cy="185" r="1.6">
      <animate attributeName="cy" values="185;208" dur="1.35s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.35s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="60" y="245" font-family="Consolas,Menlo,monospace" font-size="12" fill="#5b6068">python -m causalforge analyze incident.json --format markdown</text>
</svg>
