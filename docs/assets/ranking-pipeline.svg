<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="CausalForge ranking pipeline: ingest, propagate, fuse, rank">
  <title>CausalForge ranking pipeline</title>
  <defs>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141619"/>
      <stop offset="1" stop-color="#0a0b0d"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a2a12"/>
      <stop offset="0.5" stop-color="#ff8a3c"/>
      <stop offset="1" stop-color="#ffe0a3"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="260" fill="url(#slab)"/>

  <!-- heat bar drawn across the pipeline as material moves through the forge -->
  <rect x="60" y="20" width="840" height="6" rx="3" fill="#23262c"/>
  <rect x="60" y="20" width="0" height="6" rx="3" fill="url(#heat)">
    <animate attributeName="width" values="0;840;840" keyTimes="0;0.8;1" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- four forge stations -->
  <g font-family="Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">
    <g>
      <rect x="70" y="90" width="170" height="90" rx="10" fill="#1c1f24" stroke="#ff8a3c" stroke-width="2"/>
      <text x="155" y="125" fill="#ffd27a" font-size="18" font-weight="700">Ingest</text>
      <text x="155" y="150" fill="#8a9099" font-size="12">events + edges</text>
      <text x="155" y="168" fill="#5b6068" font-size="11">JSON / stream</text>
    </g>
    <g>
      <rect x="280" y="90" width="170" height="90" rx="10" fill="#1c1f24" stroke="#ff8a3c" stroke-width="2"/>
      <text x="365" y="125" fill="#ffd27a" font-size="18" font-weight="700">Propagate</text>
      <text x="365" y="150" fill="#8a9099" font-size="12">temporal blame</text>
      <text x="365" y="168" fill="#5b6068" font-size="11">half-life kernel</text>
    </g>
    <g>
      <rect x="490" y="90" width="170" height="90" rx="10" fill="#1c1f24" stroke="#ff8a3c" stroke-width="2"/>
      <text x="575" y="125" fill="#ffd27a" font-size="18" font-weight="700">Fuse</text>
      <text x="575" y="150" fill="#8a9099" font-size="12">error evidence</text>
